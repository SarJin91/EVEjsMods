<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Living New Eden observer</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Living New Eden</h1>
      <span class="sub" id="mod-version">observer</span>
      <a class="sub" href="/killboard.html">Killboard</a>
    </div>
    <div class="meta">
      <span class="badge" id="overall">loading</span>
      <span class="meta-item">refreshed <b id="refreshed">-</b></span>
      <span class="meta-item">telemetry age <b id="telemetry-age">-</b></span>
    </div>
  </header>
  <div class="banner banner-error hidden" id="offline" role="alert">
    Server unavailable - retrying. The game server may be stopped or the observer disabled.
  </div>
  <section class="alarms" id="alarms" aria-live="polite"></section>
  <nav class="tabs hidden" id="tabs" role="tablist"></nav>
  <main id="panels"></main>
  <footer class="foot">Read-only view of the mod in the world process. Nothing here changes the game.</footer>
  <script src="/systemCard.js"></script>
  <script src="/systemInterior.js"></script>
  <script src="/galaxy.js"></script>
  <script src="/tabs.js"></script>
  <script src="/factions.js"></script>
  <script src="/app.js"></script>
</body>
</html>
